name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v20
      - run: nix develop --command dotnet restore
      - run: nix develop --command dotnet build --no-restore --configuration Release
      - run: nix develop --command dotnet test --no-build --configuration Release
      - run: nix develop --command dotnet format --no-restore --verify-no-changes
      - run: nix develop --command nixfmt --check flake.nix
      - run: nix develop --command actionlint
